[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medallion-template"
version = "0.1.0"
description = "A reference implementation of medallion architecture with synthetic data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0,<3",
  "pydantic>=2.0,<3",
  "faker>=28.0,<41",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]
