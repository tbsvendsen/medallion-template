<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #666; }
    .mod { rx: 6; ry: 6; stroke-width: 1.5; }
    .mod-label { font-size: 12px; font-weight: 600; fill: #fff; }
    .mod-file { font-size: 9px; fill: #fff; opacity: 0.8; font-family: 'SF Mono', 'Menlo', monospace; }
    .mod-desc { font-size: 10px; fill: #fff; opacity: 0.9; }
    .flow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .data-box { rx: 4; ry: 4; fill: #f0f0f0; stroke: #ccc; stroke-width: 1; }
    .data-text { font-size: 9px; fill: #555; }
    .note { font-size: 9px; fill: #888; }
  </style>

  <text x="400" y="28" text-anchor="middle" class="title">Module Pipeline</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">Data generation → Ingestion → Validation → Standardization → Dimensional model</text>

  <!-- synthetic.py -->
  <rect x="20" y="70" width="130" height="75" class="mod" fill="#5B6770" stroke="#4a5560"/>
  <text x="85" y="93" text-anchor="middle" class="mod-label">synthetic</text>
  <text x="85" y="108" text-anchor="middle" class="mod-file">synthetic.py</text>
  <text x="85" y="126" text-anchor="middle" class="mod-desc">Faker + seed=42</text>
  <text x="85" y="138" text-anchor="middle" class="mod-desc">5 entities</text>

  <!-- pre_bronze.py -->
  <rect x="180" y="70" width="130" height="75" class="mod" fill="#8B4513" stroke="#723910"/>
  <text x="245" y="93" text-anchor="middle" class="mod-label">pre_bronze</text>
  <text x="245" y="108" text-anchor="middle" class="mod-file">pre_bronze.py</text>
  <text x="245" y="126" text-anchor="middle" class="mod-desc">Retry + backoff</text>
  <text x="245" y="138" text-anchor="middle" class="mod-desc">Raw JSON copy</text>

  <!-- bronze.py -->
  <rect x="340" y="70" width="130" height="75" class="mod" fill="#CD7F32" stroke="#A0722A"/>
  <text x="405" y="93" text-anchor="middle" class="mod-label">bronze</text>
  <text x="405" y="108" text-anchor="middle" class="mod-file">bronze.py</text>
  <text x="405" y="126" text-anchor="middle" class="mod-desc">Schema validation</text>
  <text x="405" y="138" text-anchor="middle" class="mod-desc">JSON → Parquet</text>

  <!-- silver.py -->
  <rect x="500" y="70" width="130" height="75" class="mod" fill="#808080" stroke="#666"/>
  <text x="565" y="93" text-anchor="middle" class="mod-label">silver</text>
  <text x="565" y="108" text-anchor="middle" class="mod-file">silver.py</text>
  <text x="565" y="126" text-anchor="middle" class="mod-desc">Standardize types</text>
  <text x="565" y="138" text-anchor="middle" class="mod-desc">Dedup + nulls</text>

  <!-- gold.py -->
  <rect x="660" y="70" width="120" height="75" class="mod" fill="#DAA520" stroke="#C0A030"/>
  <text x="720" y="93" text-anchor="middle" class="mod-label" fill="#333">gold</text>
  <text x="720" y="108" text-anchor="middle" class="mod-file" fill="#333">gold.py</text>
  <text x="720" y="126" text-anchor="middle" class="mod-desc" fill="#333">Kimball model</text>
  <text x="720" y="138" text-anchor="middle" class="mod-desc" fill="#333">Star schema</text>

  <!-- Flow arrows -->
  <line x1="150" y1="107" x2="178" y2="107" class="flow"/>
  <line x1="310" y1="107" x2="338" y2="107" class="flow"/>
  <line x1="470" y1="107" x2="498" y2="107" class="flow"/>
  <line x1="630" y1="107" x2="658" y2="107" class="flow"/>

  <!-- Support modules -->
  <rect x="250" y="180" width="130" height="55" class="mod" fill="#B07AA1" stroke="#9a6a8e"/>
  <text x="315" y="203" text-anchor="middle" class="mod-label">models</text>
  <text x="315" y="218" text-anchor="middle" class="mod-file">models.py</text>
  <text x="315" y="230" text-anchor="middle" class="mod-desc">Pydantic + StrEnum</text>

  <rect x="410" y="180" width="130" height="55" class="mod" fill="#4C78A8" stroke="#3b6190"/>
  <text x="475" y="203" text-anchor="middle" class="mod-label">pipeline</text>
  <text x="475" y="218" text-anchor="middle" class="mod-file">pipeline.py</text>
  <text x="475" y="230" text-anchor="middle" class="mod-desc">PipelineConfig</text>

  <rect x="570" y="180" width="130" height="55" class="mod" fill="#E15759" stroke="#c94547"/>
  <text x="635" y="203" text-anchor="middle" class="mod-label">CLI</text>
  <text x="635" y="218" text-anchor="middle" class="mod-file">run.py</text>
  <text x="635" y="230" text-anchor="middle" class="mod-desc">Entry point</text>

  <!-- Dashed lines to support modules -->
  <line x1="315" y1="180" x2="315" y2="155" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="475" y1="180" x2="475" y2="155" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Data format annotations -->
  <text x="20" y="265" class="note">Data flow: dict → JSON (data/raw/) → Parquet (data/bronze/) → Parquet (data/silver/) → Parquet (data/gold/)</text>
  <text x="20" y="278" class="note">All operations idempotent — rerunning overwrites existing output. Pipeline orchestrated by pipeline.py + run.py.</text>
</svg>
